name: Check preview
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --cache .cache/npm
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
